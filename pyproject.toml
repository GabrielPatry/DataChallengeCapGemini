[project]
name = "datachallengecapgemini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gabriel", email = "144031387+GabrielPatry@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bertopic>=0.16",
    "hdbscan>=0.8",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "openai>=1.50",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "umap-learn>=0.5",
]

[project.scripts]
datachallengecapgemini = "datachallengecapgemini:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.1",
]
